# ============================================
# APPLICATION
# ============================================
spring.application.name=backend
server.port=8080

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/freelancer_marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET:ChangeThisToAVeryLongSecretKeyAtLeast32CharactersLong123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# EMAIL CONFIGURATION (GMAIL SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# LOGGING
# ============================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# STATIC FILES
# ============================================
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# ============================================
# JACKSON
# ============================================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ============================================
# CORS
# ============================================
frontend.url=http://localhost:8081

# ============================================
# DOCKER
# ============================================
spring.docker.compose.enabled=false

# ============================================
# SERVER
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# DEVTOOLS
# ============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true